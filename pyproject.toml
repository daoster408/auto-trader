[project]
name = "auto-trader"
version = "0.1.0"
description = "Fully automated US equities swing trading system (Alpaca + Telegram, strict risk engine)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary - Internal"}
authors = [
  {name = "AUTO-TRADER Team"}
]
dependencies = [
  "alpaca-py>=0.40.0",
  "python-telegram-bot[asyncio]>=21.0",
  "pydantic-settings>=2.0",
  "pydantic>=2.0",
  "aiosqlite>=0.20.0",
  "APScheduler>=3.10",
  "structlog>=24.0",
  "tenacity>=8.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "freezegun>=1.5",
  "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
